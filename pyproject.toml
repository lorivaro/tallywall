[project]
name = "tallywall"
version = "0.1.0"
description = "Unofficial touch tally wall for the Turff house drinks tally (not affiliated with Turff)"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "lorivaro", email = "64579257+lorivaro@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
tallywall = "tallywall:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
