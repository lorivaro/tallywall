<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>Tallywall</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <h1 id="house">Tallywall</h1>
    <div class="picker">
      <nav id="drinks" class="drinks" aria-label="Drink"></nav>
      <button id="mode" class="mode" type="button" role="switch" aria-checked="false"
              aria-label="Remove mode" title="+ adds, − removes">
        <span class="plus">+</span><span class="minus">−</span>
      </button>
    </div>
    <div class="bar-end">
      <span id="status" class="status" hidden></span>
      <button id="device" class="device" type="button" title="Device name"></button>
    </div>
  </header>

  <main id="grid" class="grid" aria-live="off"></main>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-msg"></span>
  </div>

  <div id="saver" class="saver" aria-hidden="true">
    <div id="saver-body" class="saver-body">
      <div class="when">
        <div id="clock" class="clock"></div>
        <div id="date" class="date"></div>
        <div id="saver-house" class="saver-house"></div>
      </div>
      <section class="board" aria-labelledby="board-title">
        <h2 id="board-title"></h2>
        <ol id="board"></ol>
      </section>
    </div>
    <p id="saver-status" class="saver-status" hidden></p>
  </div>

  <div id="blocker" class="overlay" hidden>
    <p id="blocker-msg"></p>
  </div>

  <div id="name-dialog" class="overlay" hidden>
    <form id="name-form" class="card">
      <h2>Name this device</h2>
      <p>Shown in the tally log, e.g. “Tablet hallway” or “Anna’s phone”.</p>
      <input id="name-input" name="name" maxlength="64" autocomplete="off" required>
      <div class="actions">
        <button id="name-cancel" type="button" class="secondary">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</body>
</html>
